include:
  - project: smp/iac/pipeline-common
    ref: 4.5.0
    file: common.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'

stages:
  - code_quality
  - publish

cache:
  paths:
    - .m2/repository
    
variables:
  RULES_MASTER_BRANCH_OVERRIDE: main
  MVN_CMD: mvn -s .m2/settings.xml -U -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Denv.type=aws -Dgpg.skip=true
  SONAR_PROJECT_KEY: ldt_solp_LivedataSdkJava_77b4d360-04b4-4179-8790-03e873f21117
  WS_MAVEN_AGGREGATEMODULES: "true"
  WS_PROJECTNAME: "ldsdk-java"


######################
# Code quality stage #
######################

sonar-validate:
  image: maven:3.9.3-amazoncorretto-17
  needs: []
  stage: code_quality
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
  variables:
    GIT_DEPTH: "0"
    GIT_FETCH_EXTRA_FLAGS: "--prune --quiet +refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
  script:
    - MR_IID="${CI_OPEN_MERGE_REQUESTS%%,*}"; MR_IID="${MR_IID##*!}"
    - TARGET_BRANCH="$CI_DEFAULT_BRANCH"
    - $MVN_CMD -B verify sonar:sonar
      -Dsonar.projectKey=$SONAR_PROJECT_KEY
      -Dsonar.host.url=$SONAR_HOST
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
      -Dsonar.pullrequest.key=$MR_IID
      -Dsonar.pullrequest.branch=$CI_COMMIT_BRANCH
      -Dsonar.pullrequest.base=$TARGET_BRANCH
      -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

whitesource-check-policies:
  extends:
    - .whitesource-check-policies
    - .rules-except-master
  allow_failure: true

whitesource-update:
  extends:
    - .whitesource-update
    - .rules-only-master

#################
# Publish stage #
#################

.publish-common:
  stage: publish
  image: maven:3.9.11-amazoncorretto-21
  variables:
    GIT_DEPTH: 0
    GITLAB_PROJECT: "https://$GITLAB_GIT_PUSH_USER:$GITLAB_GIT_PUSH_TOKEN@gitlab.sportradar.ag/${CI_PROJECT_PATH}.git"
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
    - when: never

publish-javadoc:
  extends: .publish-common
  script:
    - yum install -y git > /dev/null
    - git checkout -B "$CI_COMMIT_REF_NAME"
    - rm -rf docs
    - mkdir -p docs
    - $MVN_CMD -pl sdk -am -DskipTests -DskipSiteJavadoc=false
        -DsiteJavadocOutputDirectory=${CI_PROJECT_DIR}/docs package
    - git config --global user.name "${GITLAB_LD_PUSH_USERNAME}"
    - git config --global user.email "${GITLAB_LD_PUSH_EMAIL}"
    - git add docs/
    - |
      if git diff --staged --quiet; then
        echo "docs/ unchanged; nothing to commit"
      else
        git commit -m "docs: Javadoc for ${CI_COMMIT_TAG:-$($MVN_CMD -q -DforceStdout help:evaluate -Dexpression=revision)}"
        git push $GITLAB_PROJECT
      fi
  dependencies: []
  needs: []

publish-maven-central:
  extends: .publish-common
  before_script:
    - gpg --import $GPG_PRIVATE_KEY
  script:
    - $MVN_CMD -Dgpg.keyname=$GPG_KEYID
          -Dgpg.passphrase=$GPG_PASSPHRASE
          -Dgpg.skip=false
          -DskipSiteJavadoc=false
          -B clean deploy
  dependencies: []
  needs: []
